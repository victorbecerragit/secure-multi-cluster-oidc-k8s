apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-allow
  namespace: app-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow intra-namespace traffic
  - from:
    - podSelector: {}
  egress:
  # Allow intra-namespace traffic
  - to:
    - podSelector: {}
  # Allow DNS resolution to kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
