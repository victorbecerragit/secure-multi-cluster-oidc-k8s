# keycloak-values.yaml
auth:
  adminUser: admin
  adminPassword: admin-password

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  nodePorts:
    http: 30000

# Disable TLS for local dev simplicity (standard for kind OIDC demos)
# In production, this MUST be enabled.
httpRelativePath: /
extraEnvVars:
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "false"
  - name: KC_LOG_LEVEL
    value: INFO

# Ensure Keycloak is reachable for local kind-based access
proxy: edge

# Persistence disabled for local ephemeral testing
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
  auth:
    database: keycloak
    username: bn_keycloak
    password: keycloak-password
