apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-ci-visibility
  annotations:
    security.k8s.io/project: secure-multi-cluster-oidc-k8s
    description: "Grants cluster-wide visibility to GitHub CI runners to satisfy preflight visibility checks."
subjects:
  - kind: Group
    name: "github:ci-deployers"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
