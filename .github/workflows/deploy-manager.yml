name: Deploy to Manager Cluster (OIDC)

on:
  push:
    branches: [ main ]
    paths:
      - 'examples/**'
      - 'helm/**'

# This is critical for OIDC: allows the job to request the JWT from GitHub's OIDC provider
permissions:
  id-token: write
  contents: read

