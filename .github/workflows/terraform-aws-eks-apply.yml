name: Terraform AWS EKS Apply

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/terraform-aws-eks-apply.yml"
      - "infra/terraform/aws/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: infra/terraform/aws/environments/dev

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} init

      - name: Terraform apply
        run: terraform -chdir=${{ env.TF_WORKING_DIR }} apply -input=false -auto-approve
