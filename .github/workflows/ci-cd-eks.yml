name: CI/CD to EKS (OIDC)

on:
  push:
    branches: [ main, develop ]
    paths:
      - "app/Dockerfile"
      - "app/src/**"
      - "helm/charts/myapp/**"
      - ".github/workflows/ci-cd-eks.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.AWS_EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ecr-myapp
  HELM_RELEASE: myapp

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_GITHUB_BUILD_ROLE_ARN != '' }}

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC (build role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 ||           aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_REPOSITORY="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}"
          IMAGE_URI="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          cd app
          docker build -t "${{ steps.meta.outputs.image_uri }}" .

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push container image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.image_uri }}"
          echo "Image pushed: ${{ steps.meta.outputs.image_uri }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ github.ref_name == 'main' && 'prod' || (github.ref_name == 'develop' && 'dev' || 'staging') }}
    if: ${{ (github.ref_name == 'main' && vars.AWS_GITHUB_DEPLOY_ROLE_PROD_ARN != '') || (github.ref_name == 'develop' && vars.AWS_GITHUB_DEPLOY_ROLE_ARN != '') || (github.ref_name != 'main' && github.ref_name != 'develop' && vars.AWS_GITHUB_DEPLOY_ROLE_STAGING_ARN != '') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select deploy role
        id: select_role
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "role_arn=${{ vars.AWS_GITHUB_DEPLOY_ROLE_PROD_ARN }}" >> "$GITHUB_OUTPUT"
            echo "target_namespace=app-prod" >> "$GITHUB_OUTPUT"
            echo "values_file=helm/charts/myapp/values-prod.yaml" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "role_arn=${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
            echo "target_namespace=app-dev" >> "$GITHUB_OUTPUT"
            echo "values_file=helm/charts/myapp/values-dev.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "role_arn=${{ vars.AWS_GITHUB_DEPLOY_ROLE_STAGING_ARN }}" >> "$GITHUB_OUTPUT"
            echo "target_namespace=app-staging" >> "$GITHUB_OUTPUT"
            echo "values_file=helm/charts/myapp/values-staging.yaml" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials via GitHub OIDC (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.select_role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Build kubeconfig for EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig  --name "${EKS_CLUSTER_NAME}"  --region "${AWS_REGION}"

      - name: Preflight validation (authorization & infrastructure checks)
        shell: bash
        run: |
          set -euo pipefail
          source scripts/github-actions/k8s-auth-helpers.sh

          kubectl get --raw='/version' > /dev/null
          echo "API server reachable."
          expect_yes "kubectl auth can-i get namespaces"
          expect_no "kubectl auth can-i create clusterroles.rbac.authorization.k8s.io"
          expect_no "kubectl auth can-i create clusterrolebindings.rbac.authorization.k8s.io"
          expect_no "kubectl auth can-i get secrets -n ${{ steps.select_role.outputs.target_namespace }}"
          echo "All preflight authorization checks passed."

      - name: Validate bootstrap infrastructure exists
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "${{ steps.select_role.outputs.target_namespace }}" > /dev/null || {
            echo "Namespace ${{ steps.select_role.outputs.target_namespace }} not found (bootstrap infrastructure missing)."; exit 1;
          }
          echo "Bootstrap namespace validated: ${{ steps.select_role.outputs.target_namespace }}"

      - name: Helm chart lint (detect configuration errors early)
        shell: bash
        run: |
          set -euo pipefail
          helm lint helm/charts/myapp
          echo "Helm chart passed lint."

      - name: Deploy application with Helm
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install "${HELM_RELEASE}" helm/charts/myapp --namespace "${{ steps.select_role.outputs.target_namespace }}"  --values "${{ steps.select_role.outputs.values_file }}"  --set image.repository="${{ needs.build.outputs.image_repository }}"  --set-string image.tag="${{ needs.build.outputs.image_tag }}"  --atomic  --timeout 5m  --wait

      - name: Post-deployment validation (verify guardrails remain)
        shell: bash
        run: |
          set -euo pipefail
          source scripts/github-actions/k8s-auth-helpers.sh
          TARGET_NAMESPACE="${{ steps.select_role.outputs.target_namespace }}"
          expect_yes "kubectl auth can-i get deployments -n ${TARGET_NAMESPACE}"
          expect_no "kubectl auth can-i create clusterroles.rbac.authorization.k8s.io"
          expect_no "kubectl auth can-i create clusterrolebindings.rbac.authorization.k8s.io"
          expect_no "kubectl auth can-i get secrets -n ${TARGET_NAMESPACE}"
          echo "Post-deployment guardrails verified."

      - name: Wait for deployment rollout
        shell: bash
        id: set_post_deploy_target
        run: |
          set -euo pipefail
          TARGET_NAMESPACE="${{ steps.select_role.outputs.target_namespace }}"
          echo "Waiting for ${HELM_RELEASE} deployment rollout in ${TARGET_NAMESPACE}..."
          kubectl rollout status deployment/${HELM_RELEASE} -n "${TARGET_NAMESPACE}" --timeout=5m
          echo "TARGET_NAMESPACE=${TARGET_NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "Deployment ${HELM_RELEASE} rolled out successfully."

      - name: Verify deployed image
        shell: bash
        run: |
          set -euo pipefail
          TARGET_NAMESPACE="${{ steps.set_post_deploy_target.outputs.TARGET_NAMESPACE }}"
          IMAGE_DEPLOYED=$(kubectl get deployment ${HELM_RELEASE} -n "${TARGET_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployed image: ${IMAGE_DEPLOYED}"
          echo "Expected image: ${{ needs.build.outputs.image_uri }}"
          [[ "${IMAGE_DEPLOYED}" == *"${{ needs.build.outputs.image_tag }}"* ]] || { echo "Image mismatch detected."; exit 1; }
          echo "Deployed image verified."
