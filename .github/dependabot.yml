version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Python Flask App
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Docker images
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Terraform
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Helm charts
  - package-ecosystem: "helm"
    directory: "/helm/charts/myapp"
    schedule:
      interval: "weekly"
