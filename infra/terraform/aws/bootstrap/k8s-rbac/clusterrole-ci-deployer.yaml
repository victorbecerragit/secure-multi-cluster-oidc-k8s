# ClusterRole for the GitHub Actions deploy persona (github:ci-deployers group).
#
# Platform-managed bootstrap resource.
# This cluster-scoped role is intentionally not applied by deploy workflows.
#
# Intentionally narrower than the built-in "edit" ClusterRole:
#   - No Secrets access (prevents credential harvesting from CI)
#   - No ServiceAccount mutations (prevents privilege escalation)
#   - No RBAC mutations (no roles/bindings write)
#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-ci-deployer
  annotations:
    security.k8s.io/project: secure-multi-cluster-oidc-k8s
    security.k8s.io/role-owner: platform-team
  labels:
    app.kubernetes.io/managed-by: terraform
    rbac.example.com/persona: github-ci-deployers
rules:
  # Deny secrets and rbac manipulation explicitly (best practice for CI roles)
  # Allowed: Workload management + some read visibility

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims", "endpoints", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes", "storageclasses"]
    verbs: ["get", "list", "watch"]